[platformio]
libdeps_dir = C:\pio_libs

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Tăng stack size mặc định cho FreeRTOS (do có nhiều task)
board_build.f_cpu = 240000000L

; Bật optimization để code nhỏ hơn, chạy nhanh hơn
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    https://github.com/mobizt/Firebase-ESP-Client.git